name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Unzip Project
      run: |
        find . -name "EyaRayhanAdventure-AndroidProject*.zip" -exec unzip -q {} -d project \;
        find project -name gradlew -exec chmod +x {} \;

    - name: Build APK
      run: |
        cd $(find project -name gradlew -printf '%h\n' | head -n 1)
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EyaRayhanAdventure-APK
        path: '**/build/outputs/apk/debug/*.apk'
        
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        files: '**/build/outputs/apk/debug/*.apk'
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
